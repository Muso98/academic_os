upstream academic_os {
    server web:8000;
}

server {
    listen 80;
    server_name academicos.uz www.academicos.uz 37.27.43.173;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name academicos.uz www.academicos.uz;

    ssl_certificate /etc/letsencrypt/live/academicos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academicos.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://academic_os;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
