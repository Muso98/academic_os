upstream academic_os {
    server web:8000;
}

server {
    listen 80;
    server_name academicos.uz www.academicos.uz 37.27.43.173;

    location / {
        proxy_pass http://academic_os;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
